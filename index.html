<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#101217">

<title>Accounting English Trainer</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  background:#101217;
}

body{
  margin:0;
  background:#101217;
  color:#fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
}

button{
  font-family:inherit;
  cursor:pointer;
  -webkit-appearance:none;
}

main{
  width:100%;
  max-width:620px;
  margin:0 auto;
  padding:
    22px
    16px
    calc(70px + env(safe-area-inset-bottom));
}

/* ---------- Header ---------- */

h1{
  margin:8px 0 4px;
  text-align:center;
  font-size:27px;
  line-height:1.3;
}

.subtitle{
  margin-bottom:20px;
  text-align:center;
  color:#999;
  font-size:14px;
}

/* ---------- Navigation ---------- */

nav{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}

nav button{
  flex:1;
  border:0;
  border-radius:13px;
  padding:14px 8px;
  background:#292e38;
  color:#fff;
  font-size:15px;
  font-weight:bold;
}

nav button.active{
  background:#fff;
  color:#111;
}

/* ---------- Stats ---------- */

.stats{
  display:flex;
  gap:8px;
  margin-bottom:14px;
}

.stat{
  flex:1;
  min-width:0;
  padding:11px 5px;
  background:#1c2028;
  border-radius:14px;
  text-align:center;
}

.stat-number{
  font-size:20px;
  font-weight:bold;
}

.stat-label{
  margin-top:3px;
  color:#999;
  font-size:11px;
}

/* ---------- Card ---------- */

.card{
  padding:22px 17px;
  background:#1c2028;
  border-radius:20px;
}

.type{
  color:#888;
  font-size:13px;
}

.question{
  min-height:82px;
  margin:18px 0 22px;
  font-size:29px;
  font-weight:bold;
  line-height:1.4;
  display:flex;
  align-items:center;
}

/* ---------- Choices ---------- */

.choices{
  display:grid;
  gap:10px;
}

.choice{
  width:100%;
  border:0;
  border-radius:13px;
  padding:15px;
  background:#292e38;
  color:#fff;
  font-size:15px;
  font-weight:bold;
  text-align:left;
  line-height:1.45;
}

.choice:active{
  transform:scale(.98);
}

.choice.correct{
  background:#18794e;
}

.choice.wrong{
  background:#a83d3d;
}

.choice.disabled{
  opacity:.65;
}

/* ---------- Result ---------- */

#result{
  min-height:29px;
  margin-top:18px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
}

#explanation{
  margin-top:12px;
  color:#ccc;
  font-size:14px;
  line-height:1.7;
}

.answerbox{
  margin-top:12px;
  padding:14px;
  background:#14171c;
  border-radius:13px;
}

.answerlabel{
  color:#888;
  font-size:12px;
}

.answer{
  margin-top:4px;
  font-size:20px;
  font-weight:bold;
  line-height:1.4;
}

#next{
  display:none;
  width:100%;
  margin-top:17px;
  border:0;
  border-radius:13px;
  padding:15px;
  background:#fff;
  color:#111;
  font-size:15px;
  font-weight:bold;
}

/* ---------- Analysis ---------- */

.section{
  margin-bottom:13px;
  padding:18px;
  background:#1c2028;
  border-radius:18px;
}

.section h2{
  margin:0 0 14px;
  font-size:18px;
}

.bigscore{
  margin:5px 0;
  text-align:center;
  font-size:42px;
  font-weight:bold;
}

.center{
  text-align:center;
  color:#999;
  font-size:13px;
  line-height:1.7;
}

/* ---------- Bars ---------- */

.barrow{
  margin-bottom:15px;
}

.barrow:last-child{
  margin-bottom:0;
}

.bartitle{
  display:flex;
  justify-content:space-between;
  margin-bottom:5px;
  font-size:13px;
}

.bar{
  height:8px;
  overflow:hidden;
  background:#30343d;
  border-radius:8px;
}

.fill{
  height:100%;
  background:#888;
  border-radius:8px;
}

/* ---------- Weak questions ---------- */

.weak{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:11px 0;
  border-bottom:1px solid #30343d;
  font-size:14px;
  line-height:1.5;
}

.weak:last-child{
  border-bottom:0;
}

.weak-main{
  min-width:0;
}

.weak-en{
  margin-top:2px;
  color:#888;
  font-size:12px;
}

.red{
  color:#ff8c8c;
  font-weight:bold;
}

.green{
  color:#80d7aa;
  font-weight:bold;
}

/* ---------- Buttons ---------- */

.reset{
  width:100%;
  margin-top:15px;
  border:1px solid #444;
  border-radius:13px;
  padding:14px;
  background:transparent;
  color:#999;
  font-size:14px;
}

.review{
  width:100%;
  margin-bottom:13px;
  border:0;
  border-radius:14px;
  padding:15px;
  background:#fff;
  color:#111;
  font-size:15px;
  font-weight:bold;
}

/* ---------- Utility ---------- */

.hidden{
  display:none !important;
}

.small{
  color:#888;
  font-size:12px;
  line-height:1.6;
}

.message{
  padding:10px 0;
  color:#aaa;
  text-align:center;
  font-size:13px;
  line-height:1.7;
}

.streak{
  margin-top:5px;
  color:#aaa;
  text-align:center;
  font-size:12px;
}
</style>
</head>

<main>

</div>


<!-- =========================

========================= -->

<nav>

</div>


<button

</button>

</section>

</main>

function loadJSON(key, fallback){

  try{

    const value = localStorage.getItem(key);

    if(!value){
      return fallback;
    }

    const parsed = JSON.parse(value);

    return parsed ?? fallback;

  }catch(error){

    console.warn("保存データの読み込みに失敗:", error);

    return fallback;

  }

}

/* =========================================================
   シャッフル
========================================================= */

function shuffle(array){

  const result = Array.isArray(array)
    ? array.slice()
    : [];

  for(
    let i=result.length-1;
    i>0;
    i--
  ){

    const j=Math.floor(
      Math.random()*(i+1)
    );

    const temp=result[i];

    result[i]=result[j];

    result[j]=temp;

  }

  return result;

}


/* =========================================================
   重み付き問題選択
========================================================= */

function chooseQuestion(){

  if(validQuestions.length===0){
    return -1;
  }


  /* 苦手復習モード */

  if(reviewMode){

    const weakIndexes = validQuestions
      .map(function(q,index){

        const m=memory[index] || {
          correct:0,
          wrong:0
        };

        return {
          index:index,
          wrong:Number(m.wrong)||0,
          correct:Number(m.correct)||0
        };

      })
      .filter(function(x){

        return x.wrong>0;

      })
      .sort(function(a,b){

        const scoreA=a.wrong-a.correct;
        const scoreB=b.wrong-b.correct;

        return scoreB-scoreA;

      });


    if(weakIndexes.length>0){

      let pool=[];

      weakIndexes.forEach(function(item){

        const weight=
          2+
          item.wrong*3+
          Math.max(
            0,
            item.wrong-item.correct
          );

        for(
          let i=0;
          i<weight;
          i++
        ){

          pool.push(item.index);

        }

      });


      if(pool.length>0){

        let selected=
          pool[
            Math.floor(
              Math.random()*pool.length
            )
          ];


        if(
          pool.length>1 &&
          selected===lastQuestion
        ){

          const alternatives=
            pool.filter(function(x){

              return x!==lastQuestion;

            });

          selected=
            alternatives[
              Math.floor(
                Math.random()*alternatives.length
              )
            ];

        }

        return selected;

      }

    }

    /* 弱点がまだない場合は通常モードへ */

    reviewMode=false;

  }


  /* 通常モード */

  let pool=[];


  validQuestions.forEach(function(q,index){

    const m=memory[index] || {
      correct:0,
      wrong:0
    };

    const wrong=Number(m.wrong)||0;
    const correct=Number(m.correct)||0;

    let weight=3;

    /* 初見問題 */

    if(correct===0 && wrong===0){
      weight+=5;
    }

    /* 間違いを強く優先 */

    weight+=wrong*4;

    /* 苦手ならさらに優先 */

    if(wrong>correct){
      weight+=6;
    }

    /* 直前の問題は少し出にくくする */

    if(index===lastQuestion){
      weight=1;
    }

    for(
      let i=0;
      i<weight;
      i++
    ){

      pool.push(index);

    }

  });


  if(pool.length===0){

    return Math.floor(
      Math.random()*validQuestions.length
    );

  }


  return pool[
    Math.floor(
      Math.random()*pool.length
    )
  ];

}


/* =========================================================
   4択生成
========================================================= */

function createChoices(questionIndex){

  const question=
    validQuestions[questionIndex];


  if(!question){
    return [];
  }


  /*
   * 正解以外の候補
   *
   * まず同じカテゴリーを優先。
   * それでも足りなければ全問題から補充。
   */

  const sameCategory =
    validQuestions.filter(function(q,index){

      return (
        index!==questionIndex &&
        q.cat===question.cat
      );

    });


  const others =
    validQuestions.filter(function(q,index){

      return index!==questionIndex;

    });


  let candidates=
    shuffle(sameCategory);


  const used=
    new Set([question.en]);


  const result=[question.en];


  /* 同じカテゴリーから追加 */

  for(
    let i=0;
    i<candidates.length &&
    result.length<4;
    i++
  ){

    const answer=candidates[i].en;

    if(
      !used.has(answer)
    ){

      used.add(answer);

      result.push(answer);

    }

  }


  /* 足りなければ全体から追加 */

  if(result.length<4){

    candidates=
      shuffle(others);

    for(
      let i=0;
      i<candidates.length &&
      result.length<4;
      i++
    ){

      const answer=candidates[i].en;

      if(
        !used.has(answer)
      ){

        used.add(answer);

        result.push(answer);

      }

    }

  }


  return shuffle(result);

}

/* =========================================================
   回答処理
========================================================= */

function checkAnswer(
  answer,
  clickedButton
){

  if(answered){
    return;
  }


  answered=true;


  const q=
    validQuestions[current];


  if(!q){
    return;
  }


  const isCorrect=
    answer===q.en;


  /* メモリ初期化 */

  if(!memory[current]){

    memory[current]={
      correct:0,
      wrong:0
    };

  }


  /* 統計 */

  stats.total++;


  if(isCorrect){

    stats.correct++;

    stats.streak++;

    if(
      stats.streak>
      stats.bestStreak
    ){

      stats.bestStreak=
        stats.streak;

    }

    memory[current].correct++;

  }else{

    stats.streak=0;

    memory[current].wrong++;

  }


  saveData();


  /* ボタンをロック */

  const allButtons=
    document.querySelectorAll(
      ".choice"
    );


  allButtons.forEach(function(button){

    button.disabled=true;

    button.classList.add(
      "disabled"
    );


    if(
      button.textContent===q.en
    ){

      button.classList.add(
        "correct"
      );

    }

  });


  /* 押した選択肢 */

  if(!isCorrect){

    clickedButton.classList.add(
      "wrong"
    );

  }


  /* 結果 */

  document.getElementById(
    "result"
  ).textContent=
    isCorrect
      ? "🎉 正解！"
      : "❌ 不正解";


  /* 解説 */

  document.getElementById(
    "explanation"
  ).innerHTML=

    '<div class="answerbox">' +

      '<div class="answerlabel">' +
        '正解' +
      '</div>' +

      '<div class="answer">' +
        escapeHTML(q.en) +
      '</div>' +

    '</div>' +

    '<div style="margin-top:12px">' +
      '💡 ' +
      escapeHTML(q.ex || "") +
    '</div>';


  document.getElementById(
    "next"
  ).style.display="block";


  updateStats();

}


/* =========================================================

========================================================= */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

/* =========================================================
   自己分析
========================================================= */

function buildAnalysis(){

  const total=
    Number(stats.total)||0;

  const correct=
    Number(stats.correct)||0;


  const rate=
    total===0
      ? 0
      : Math.round(
          correct/total*100
        );


  document.getElementById(
    "analysisRate"
  ).textContent=
    rate+"%";


  document.getElementById(
    "analysisSummary"
  ).innerHTML=
    total===0

      ? "まだ学習データがありません。まず問題を解いてみよう。"

      :

        "回答 "+
        total+
        "問　｜　正解 "+
        correct+
        "問　｜　最高連続 "+
        (Number(stats.bestStreak)||0)+
        "問";


  /* ---------- 分野別 ---------- */

  const categories={};


  validQuestions.forEach(function(q,index){

    if(!categories[q.cat]){

      categories[q.cat]={
        correct:0,
        wrong:0
      };

    }


    const m=
      memory[index] || {
        correct:0,
        wrong:0
      };


    categories[q.cat].correct +=
      Number(m.correct)||0;


    categories[q.cat].wrong +=
      Number(m.wrong)||0;

  });


  let categoryHTML="";


  Object.keys(categories).forEach(
    function(category){

      const data=
        categories[category];


      const attempts=
        data.correct+
        data.wrong;


      const r=
        attempts===0
          ? 0
          : Math.round(
              data.correct/
              attempts*100
            );


      categoryHTML +=

        '<div class="barrow">' +

          '<div class="bartitle">' +

            '<span>'+
              escapeHTML(category)+
            '</span>' +

            '<span>'+
              r+
              '%'+
            '</span>' +

          '</div>' +

          '<div class="bar">' +

            '<div class="fill" '+
              'style="width:'+r+'%">'+
            '</div>' +

          '</div>' +

        '</div>';

    }
  );


  document.getElementById(
    "categoryAnalysis"
  ).innerHTML=
    categoryHTML;


  /* ---------- 苦手問題 ---------- */

  const weak=
    validQuestions
      .map(function(q,index){

        const m=
          memory[index] || {
            correct:0,
            wrong:0
          };


        const c=
          Number(m.correct)||0;

        const w=
          Number(m.wrong)||0;

        const attempts=
          c+w;


        const r=
          attempts===0
            ? 0
            : Math.round(
                c/attempts*100
              );


        return {
          q:q,
          index:index,
          correct:c,
          wrong:w,
          attempts:attempts,
          rate:r
        };

      })
      .filter(function(item){

        return item.wrong>0;

      })
      .sort(function(a,b){

        /*
         * 間違い回数
         * ↓
         * 正答率
         * ↓
         * 回答回数
         */

        if(
          b.wrong!==a.wrong
        ){

          return b.wrong-a.wrong;

        }


        if(
          a.rate!==b.rate
        ){

          return a.rate-b.rate;

        }


        return b.attempts-
          a.attempts;

      })
      .slice(0,5);


  let weakHTML="";


  if(weak.length===0){

    weakHTML=
      '<div class="message">' +
        'まだ間違えた問題がありません。<br>' +
        '問題を解くと、ここに苦手問題が表示されます。' +
      '</div>';

  }else{

    weak.forEach(function(item){

      weakHTML +=

        '<div class="weak">' +

          '<div class="weak-main">' +

            '<div>'+
              escapeHTML(
                item.q.ja
              )+
            '</div>' +

            '<div class="weak-en">'+
              escapeHTML(
                item.q.en
              )+
            '</div>' +

          '</div>' +

          '<div class="red">'+
            item.rate+
            '%'+
          '</div>' +

        '</div>';

    });

  }


  document.getElementById(
    "weakQuestions"
  ).innerHTML=
    weakHTML;


  /* ---------- 英語パーツ ---------- */

  const tags={};


  validQuestions.forEach(function(q,index){

    const m=
      memory[index] || {
        correct:0,
        wrong:0
      };


    const c=
      Number(m.correct)||0;

    const w=
      Number(m.wrong)||0;

    const attempts=c+w;


    if(attempts===0){
      return;
    }


    const qTags=
      Array.isArray(q.tags)
        ? q.tags
        : [];


    qTags.forEach(function(tag){

      if(!tags[tag]){

        tags[tag]={
          correct:0,
          wrong:0
        };

      }


      tags[tag].correct+=c;

      tags[tag].wrong+=w;

    });

  });


  const tagList=
    Object.keys(tags)
      .map(function(tag){

        const c=
          tags[tag].correct;

        const w=
          tags[tag].wrong;

        const attempts=c+w;


        return {
          tag:tag,
          correct:c,
          wrong:w,
          attempts:attempts,
          rate:
            attempts===0
              ? 0
              : Math.round(
                  c/attempts*100
                )
        };

      })
      .filter(function(item){

        return item.attempts>=2;

      })
      .sort(function(a,b){

        return a.rate-b.rate;

      })
      .slice(0,5);


  let tagHTML="";


  if(tagList.length===0){

    tagHTML=
      '<div class="message">' +
        '同じ英語パーツを含む問題を<br>' +
        '2回以上解くと分析できます。' +
      '</div>';

  }else{

    tagList.forEach(function(item){

      tagHTML +=

        '<div class="weak">' +

          '<div class="weak-main">' +

            '<div>'+
              escapeHTML(
                formatTag(item.tag)
              )+
            '</div>' +

            '<div class="weak-en">'+
              '正解 '+
              item.correct+
              ' / '+
              item.attempts+
              '回'+
            '</div>' +

          '</div>' +

          '<div class="'+
            (
              item.rate<60
                ? "red"
                : "green"
            )+
          '">' +
            item.rate+
            '%' +
          '</div>' +

        '</div>';

    });

  }


  document.getElementById(
    "wordAnalysis"
  ).innerHTML=
    tagHTML;


  /* ---------- アドバイス ---------- */

  let advice="";


  if(total===0){

    advice=
      "まずは10問ほど解いてみよう。データがたまるほど、あなた専用の弱点分析が正確になります。";

  }else if(rate<60){

    advice=
      "現在は正答率60%未満。新しい単語を増やすより、間違えた問題を繰り返して定着させる段階です。";

  }else if(rate<80){

    advice=
      "基礎はかなり身についてきています。苦手問題TOP5を中心に復習して、正答率80%超を目指そう。";

  }else{

    advice=
      "かなり良い状態です。ここからは似た表現の区別や、長い会計英語を構成要素に分解して覚える段階です。";

  }


  document.getElementById(
    "advice"
  ).innerHTML=
    '<div class="message">'+
      advice+
    '</div>';

}
