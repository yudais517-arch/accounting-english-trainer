<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Accounting English Trainer</title>

<style>

*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#101114;color:#fff}

main{max-width:600px;margin:auto;padding:24px 18px 50px}

h1{text-align:center;font-size:27px;margin:10px 0 5px}.sub{text-align:center;color:#999;margin-bottom:25px}

.stats{display:flex;justify-content:space-between;background:#1d2027;border-radius:15px;padding:15px;margin-bottom:20px}

.card{background:#1d2027;border-radius:20px;padding:25px 18px;text-align:center}

.question{font-size:30px;font-weight:bold;margin:25px 0 10px}

.type{color:#999;font-size:14px}.choices{display:grid;gap:12px;margin-top:25px}

button{border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:bold;background:#292e38;color:#fff}

button:active{transform:scale(.98)}button.correct{background:#167c4b}button.wrong{background:#9d3030}

#next{background:#fff;color:#111;margin-top:18px;width:100%;display:none}

.explain{margin-top:18px;color:#bbb;line-height:1.6;display:none}

.mode{display:flex;gap:10px;margin-bottom:15px}.mode button{flex:1;font-size:14px}

#result{text-align:center;font-size:20px;margin:15px}

</style>

</head>

<main>
