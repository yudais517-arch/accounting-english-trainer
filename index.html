localStorage.getItem("accountingStats")
)||{
correct:0,
total:0
};

let memory=JSON.parse(
localStorage.getItem("accountingMemory")
)||{};

let current=-1;
let answered=false;


/* ==================================================
   配列シャッフル
================================================== */

function shuffle(arr){

let a=[...arr];

for(let i=a.length-1;i>0;i--){

let j=Math.floor(Math.random()*(i+1));

[a[i],a[j]]=[a[j],a[i]];

}

return a;

}


/* ==================================================
   重み付き問題選択
================================================== */

function chooseQuestion(){

let pool=[];

questions.forEach((q,i)=>{

let m=memory[i]||{
wrong:0,
correct:0
};

let weight=1;

weight+=m.wrong*4;

if(m.correct===0){
weight+=3;
}

if(m.wrong>m.correct){
weight+=5;
}

for(let n=0;n<weight;n++){
pool.push(i);
}

});

return pool[
Math.floor(Math.random()*pool.length)
];

}


/* ==================================================
   問題表示
================================================== */

function loadQuestion(){

answered=false;

current=chooseQuestion();

let q=questions[current];

document.getElementById("question")
.textContent=q.ja;

document.getElementById("result")
.textContent="";

document.getElementById("explanation")
.innerHTML="";

document.getElementById("next")
.style.display="none";

let choices=document.getElementById("choices");

choices.innerHTML="";


let wrongAnswers = shuffle(
  questions
    .filter((item, index) => index !== current)
    .map(item => item.en)
);

let answers = shuffle([
  q.en,
  wrongAnswers[0],
  wrongAnswers[1],
  wrongAnswers[2]
]);

answers.forEach(answer => {

  let button = document.createElement("button");

  button.className = "choice";
  button.textContent = answer;

  button.onclick = () => {
    checkAnswer(answer, button);
  };

  choices.appendChild(button);

});

choices.appendChild(button);

});

updateStats();

}


/* ==================================================
   回答
================================================== */

function checkAnswer(answer,button){

if(answered)return;

answered=true;

let q=questions[current];

let correct=answer===q.en;

stats.total++;

if(correct){
stats.correct++;
}

if(!memory[current]){

memory[current]={
correct:0,
wrong:0
};

}

if(correct){
memory[current].correct++;
}else{
memory[current].wrong++;
}


localStorage.setItem(
"accountingStats",
JSON.stringify(stats)
);

localStorage.setItem(
"accountingMemory",
JSON.stringify(memory)
);


/* 正解を表示 */

document.querySelectorAll(".choice")
.forEach(b=>{

b.classList.add("disabled");

if(b.textContent===q.en){

b.classList.add("correct");

}

});


if(correct){

button.classList.add("correct");

document.getElementById("result")
.textContent="🎉 正解！";

}else{

button.classList.add("wrong");

document.getElementById("result")
.textContent="❌ 不正解";

}


document.getElementById("explanation")
.innerHTML=

`<div class="answerbox">

<div class="answerlabel">
正解
</div>

<div class="answer">
${q.en}
</div>

</div>

<div style="margin-top:12px">
💡 ${q.ex}
</div>`;


document.getElementById("next")
.style.display="block";

updateStats();

}

document.getElementById("score")
.textContent=stats.correct;

document.getElementById("total")
.textContent=stats.total;

let rate=stats.total===0
?0
:Math.round(
stats.correct/stats.total*100
);

document.getElementById("rate")
.textContent=rate+"%";

}


/* ==================================================
   次の問題
================================================== */

function nextQuestion(){

loadQuestion();

}


/* ==================================================
   画面切替
================================================== */

function showStudy(){

document.getElementById("study")
.classList.remove("hidden");

document.getElementById("analysis")
.classList.add("hidden");

document.getElementById("studyTab")
.classList.add("active");

document.getElementById("analysisTab")
.classList.remove("active");

}


function showAnalysis(){

document.getElementById("study")
.classList.add("hidden");

document.getElementById("analysis")
.classList.remove("hidden");

document.getElementById("studyTab")
.classList.remove("active");

document.getElementById("analysisTab")
.classList.add("active");

buildAnalysis();

}


/* ==================================================
   自己分析
================================================== */

function buildAnalysis(){

let rate=stats.total===0
?0
:Math.round(
stats.correct/stats.total*100
);

document.getElementById("analysisRate")
.textContent=rate+"%";


/* 分野別 */

let categories={};

questions.forEach((q,i)=>{

if(!categories[q.cat]){

categories[q.cat]={
correct:0,
total:0
};

}

let m=memory[i]||{
correct:0,
wrong:0
};

categories[q.cat].correct+=m.correct;

categories[q.cat].total+=
m.correct+m.wrong;

});


let categoryHTML="";

Object.keys(categories).forEach(cat=>{

let d=categories[cat];

let r=d.total===0
?0
:Math.round(
d.correct/d.total*100
);

categoryHTML+=`

<div class="barrow">

<div class="bartitle">

<span>${cat}</span>

<span>${r}%</span>

</div>

<div class="bar">

<div class="fill"
style="width:${r}%">
</div>

</div>

</div>

`;

});

document.getElementById("categoryAnalysis")
.innerHTML=
categoryHTML;


/* 苦手問題 */

let weak=questions
.map((q,i)=>{

let m=memory[i]||{
correct:0,
wrong:0
};

return{
q,
i,
wrong:m.wrong,
correct:m.correct,
total:m.correct+m.wrong
};

})
.filter(x=>x.wrong>0)
.sort((a,b)=>{

if(b.wrong!==a.wrong){
return b.wrong-a.wrong;
}

return a.correct-b.correct;

})
.slice(0,5);


let weakHTML="";

if(weak.length===0){

weakHTML=
`<div class="center">
まだ間違えた問題がありません。<br>
まずは問題を解いてみよう！
</div>`;

}else{

weak.forEach(x=>{

let r=x.total===0
?0
:Math.round(
x.correct/x.total*100
);

weakHTML+=`

<div class="weak">

<span>
${x.q.ja}
<br>
<span class="small">
${x.q.en}
</span>
</span>

<span class="red">
${r}%
</span>

</div>

`;

});

}

document.getElementById("weakQuestions")
.innerHTML=weakHTML;


/* 英語パーツ */

let tags={};

questions.forEach((q,i)=>{

let m=memory[i]||{
correct:0,
wrong:0
};

let total=m.correct+m.wrong;

if(total===0)return;

q.tags.forEach(tag=>{

if(!tags[tag]){

tags[tag]={
correct:0,
total:0
};

}

tags[tag].correct+=m.correct;

tags[tag].total+=total;

});

});


let tagList=Object.keys(tags)
.map(tag=>{

let d=tags[tag];

return{
tag,
rate:Math.round(
d.correct/d.total*100
),
total:d.total
};

})
.filter(x=>x.total>=2)
.sort((a,b)=>a.rate-b.rate)
.slice(0,5);


let tagHTML="";

if(tagList.length===0){

tagHTML=
`<div class="center">
同じ英語パーツを含む問題を<br>
2回以上解くと分析できます。
</div>`;

}else{

tagList.forEach(x=>{

tagHTML+=`

<div class="weak">

<span>
${formatTag(x.tag)}
</span>

<span class="${x.rate<60?'red':'green'}">
${x.rate}%
</span>

</div>

`;

});

}

document.getElementById("wordAnalysis")
.innerHTML=tagHTML;


/* アドバイス */

let advice="";

if(stats.total===0){

advice=
"まずは10問ほど解いてみよう。データがたまると、あなたの弱点を分析できるようになります。";

}else if(rate<60){

advice=
"現在は正答率が60%未満。まずは量を増やすより、間違えた問題を繰り返して定着させるのがおすすめ。";

}else if(rate<80){

advice=
"基礎はかなり身についてきています。苦手問題を重点的に復習して80%超を目指そう。";

}else{

advice=
"かなり良い状態。ここからは似た単語の区別や細かい会計用語を重点的に潰していこう。";

}

document.getElementById("advice")
.innerHTML=advice;

}


/* ==================================================
   英語パーツ表示
================================================== */

function formatTag(tag){

const names={

"receivable":"receivable",
"payable":"payable",
"accrued":"accrued",
"prepaid":"prepaid",
"unearned":"unearned",
"gain":"gain",
"loss":"loss",
"expense":"expense",
"revenue":"revenue",
"income":"income",
"interest":"interest",
"capital":"capital",
"surplus":"surplus",
"reserve":"reserve",
"treasury":"treasury",
"stock":"stock",
"securities":"securities",
"valuation":"valuation",
"allowance":"allowance",
"provision":"provision",
"bonds":"bonds",
"notes":"notes",
"cash":"cash",
"inventory":"inventory",
"fixed-assets":"fixed assets",
"intangible":"intangible assets",
"goodwill":"goodwill",
"dividend":"dividend",
"amortization":"amortization",
"software":"software",
"commission":"commission",
"organization":"organization",
"commencement":"commencement",
"development":"development",
"issuance":"issuance",
"foreign-exchange":"foreign exchange",
"reversal":"reversal",
"insurance":"insurance",
"subsidy":"subsidy",
"miscellaneous":"miscellaneous",
"land":"land",
"hedge":"hedge",
"rights":"rights",
"suspense":"suspense",
"temporary":"temporary",
"tax":"tax",
"fire":"fire"

};

return names[tag]||tag;

}


/* ==================================================
   リセット
================================================== */

function resetData(){

let ok=confirm(
"学習記録をすべて削除しますか？"
);

if(!ok)return;

stats={
correct:0,
total:0
};

memory={};

localStorage.removeItem(
"accountingStats"
);

localStorage.removeItem(
"accountingMemory"
);

updateStats();

buildAnalysis();

loadQuestion();

}


/* ==================================================
   起動
================================================== */

loadQuestion();

</script>
